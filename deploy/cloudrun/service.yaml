# Cloud Run service configuration.
#
# Deploy with:
#   gcloud run deploy pixiv2kindle \
#     --source=. \
#     --region=asia-east1 \
#     --platform=managed \
#     --allow-unauthenticated=false \
#     --set-env-vars="$(cat .env | tr '\n' ',')" \
#     --timeout=1800 \
#     --cpu=1 \
#     --memory=512Mi \
#     --max-instances=1 \
#     --min-instances=0
#
# Key settings:
#   --timeout=1800       : 30 min, matches the Cloud Tasks dispatch deadline so long
#                          novels finish instead of being re-dispatched mid-run.
#                          (Discord follow-ups still stop after 15 min.)
#   --max-instances=1    : Single-user tool. Duplicate-task protection is kept
#                          in memory, so it is only airtight with one instance.
#   --min-instances=0    : Save cost when idle
#   --allow-unauthenticated=false : Cloud Tasks uses OIDC to authenticate
#
# Notes:
#   - Cloud Tasks will invoke /internal/tasks/execute as a normal request
#   - The request runs with full CPU for its entire duration
#   - No need for --no-cpu-throttling since the task runs within the request
#   - Queue retry policy (keep low; each retry re-translates a whole novel):
#       gcloud tasks queues update pixiv2kindle-queue --location=asia-east1 \
#         --max-attempts=3 --min-backoff=60s

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pixiv2kindle
spec:
  template:
    metadata:
      annotations:
        # Maximum request timeout (seconds).
        run.googleapis.com/timeout: "1800"
        # Scale to zero when idle.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 1800
      containers:
        - image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
